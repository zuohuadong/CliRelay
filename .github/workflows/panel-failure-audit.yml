name: panel-failure-audit

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    if: >-
      github.repository == 'zuohuadong/CliRelay' &&
      github.event.pull_request.number == 193 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/panel-verification-20261002'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read failed job log and extract failure context
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --allow-escape-sequences repos/zuohuadong/CliRelay/actions/jobs/110687480188/logs > "${RUNNER_TEMP}/failed-job.log"
          python3 - <<'PY'
          import os, pathlib, re
          raw = (pathlib.Path(os.environ['RUNNER_TEMP']) / 'failed-job.log').read_text(encoding='utf-8-sig')
          lines = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', raw).splitlines()
          selected = set()
          for i, line in enumerate(lines):
              if re.search(r'--- FAIL:|^.*Z FAIL\s|panic:|fatal error:|\[build failed\]', line):
                  selected.update(range(max(0,i-2),min(len(lines),i+18)))
          if not selected:
              raise SystemExit('No failure details found in completed job log')
          result = '\n'.join(lines[i] for i in sorted(selected))
          print(result[:22000])
          pathlib.Path('failure-details.log').write_text(result)
          PY
      - name: Save bounded failure details
        uses: actions/upload-artifact@v4
        with:
          name: panel-backend-failure-details
          path: failure-details.log
          retention-days: 3
