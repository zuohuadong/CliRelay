# Server host/interface to bind to. Default is empty ("") to bind all interfaces (IPv4 + IPv6).
# Use "127.0.0.1" or "localhost" to restrict access to local machine only.
host: ""

# Server port
port: 8317

# TLS settings for HTTPS. When enabled, the server listens with the provided certificate and key.
tls:
  enable: false
  cert: ""
  key: ""

# Management API settings
remote-management:
  # Whether to allow remote (non-localhost) management access.
  # When false, only localhost can access management endpoints (a key is still required).
  allow-remote: false

  # Management key. If a plaintext value is provided here, it will be hashed on startup.
  # All management requests (even from localhost) require this key.
  # Leave empty to disable the Management API entirely (404 for all /v0/management routes).
  secret-key: ""

  # Disable the bundled management control panel asset download and HTTP route when true.
  disable-control-panel: false

  # Disable automatic periodic background updates of the management panel from GitHub (default: false).
  # When enabled, the panel is only downloaded on first access if missing, and never auto-updated afterward.
  # disable-auto-update-panel: false

  # GitHub repository for the management control panel. Accepts a repository URL or releases API URL.
  panel-github-repository: "https://github.com/router-for-me/Cli-Proxy-API-Management-Center"

# Authentication directory (supports ~ for home directory)
auth-dir: "~/.cli-proxy-api"

# API keys for authentication
api-keys:
  - "your-api-key-1"
  - "your-api-key-2"
  - "your-api-key-3"

# Enable debug logging
debug: false

# Enable pprof HTTP debug server (host:port). Keep it bound to localhost for safety.
pprof:
  enable: false
  addr: "127.0.0.1:8316"

# Maximum bytes accepted for one OpenAI Responses HTTP body or WebSocket message.
# The same cap applies after zstd decompression. Default: 33554432 (32 MiB).
responses-max-inbound-bytes: 33554432
# Aggregate in-flight Responses request memory budget after applying a 4x amplification estimate.
responses-memory-budget-bytes: 268435456
# Maximum retained websocket transcript/session state and per-turn output.
responses-websocket-max-session-bytes: 67108864
responses-websocket-max-turn-output-bytes: 33554432
# Combined cached websocket tool call/output bytes per downstream session.
# The implementation assigns half of this budget to each cache.
responses-websocket-tool-cache-bytes: 8388608
# Aggregate estimated retained/active state budget shared by all Responses websocket sessions.
# Session state is charged at 2x its serialized byte size. Default: 192 MiB.
responses-websocket-memory-budget-bytes: 201326592
# Optional process-local concurrent Responses WebSocket cap.
# Set to 0 for no connection-count limit, or a positive number to opt in.
responses-websocket-max-connections: 0

# Standard dynamic library plugins are trusted in-process code. They are disabled by default.
# Build Go examples with go build -buildmode=c-shared for the target GOOS/GOARCH.
# Other languages can implement the same C ABI and JSON method protocol.
# Plugin executors require a matching auth record with the same provider key.
# If the same provider is configured as OpenAI-compatible, the native executor wins.
# Plugin command-line flags and Management API routes are optional capabilities.
# Existing native flags/routes and higher-priority plugin flags/routes cannot be replaced.
# Plugin list Management API reads Logo and ConfigFields from plugin metadata for management UI display.
# Per-plugin enabled only controls plugins.configs.<pluginID>.enabled and does not implicitly change global plugins.enabled.
plugins:
  enabled: false
  dir: "plugins"
  # Additional plugin store registries. The built-in official registry is always included.
  # store-sources:
  #   - "https://example.com/cliproxy-plugins/registry.json"
  # Optional plugin store auth rules. Values are read from environment variables;
  # tokens are not written into plugin manifests or node status.
  # store-auth:
  #   - match: "https://example.com/cliproxy-plugins/"
  #     apply-to: ["registry", "artifact"]
  #     type: bearer
  #     token-env: "CLIPROXY_PLUGIN_STORE_TOKEN"
  configs:
    example:
      enabled: true
      priority: 1
      config1: true
      config2: "string"
      config3: 3
      mode: "safe" # enum example: safe, fast

# When true, disable high-overhead request logging and HTTP middleware features to reduce per-request memory usage under high concurrency.
commercial-mode: false

# When true, write application logs to rotating files instead of stdout
logging-to-file: false

# Maximum total size (MB) of log files under the logs directory. When exceeded, the oldest log
# files are deleted until within the limit. Set to 0 to disable.
logs-max-total-size-mb: 0

# Maximum number of error log files retained when request logging is disabled.
# When exceeded, the oldest error log files are deleted. Default is 10. Set to 0 to disable cleanup.
error-logs-max-files: 10

# When false, disable in-memory usage statistics aggregation
usage-statistics-enabled: false

# How long (in seconds) usage queue items are retained in memory for the Management API.
# The local Redis RESP usage output is disabled.
# Default: 60. Max: 3600.
redis-usage-queue-retention-seconds: 60

# Proxy URL. Supports socks5/http/https protocols. Example: socks5://user:pass@192.168.1.1:1080/
# Per-entry proxy-url also supports "direct" or "none" to bypass both the global proxy-url and environment proxies explicitly.
proxy-url: ""

# Fail-closed per-account egress for Codex OAuth accounts.
# Configure SOCKS5/HTTP endpoints and bind each Codex account in the management panel.
# When disabled or when an account has no valid endpoint binding, Codex outbound requests are rejected;
# they never fall back to proxy-url, environment proxies, the host network, or another endpoint.
# Bindings are exclusive: one account per endpoint and one endpoint per account. The same OAuth
# never automatically fails over to another endpoint or public IP.
# Scope: server-side OAuth code exchange, token refresh, and Codex API traffic are isolated. The browser
# that opens auth.openai.com still uses the administrator workstation's network and is outside this scope.
egress-network:
  enabled: false
  endpoint-check-interval: "2m"
  endpoint-health-ttl: "5m"
  # HTTPS IP echo services used in order. Every request is sent through the endpoint being checked.
  # Each response may be {"ip":"..."} or a plain IPv4/IPv6 address.
  probe-urls:
    - "https://api.ipify.org?format=json"
    - "https://ifconfig.co/json"

# When true, unprefixed model requests only use credentials without a prefix (except when prefix == model name).
force-model-prefix: false

# When true, forward filtered upstream response headers to downstream clients.
# Default is false (disabled).
passthrough-headers: false

# Number of times to retry a request. Retries will occur if the HTTP response code is 403, 408, 500, 502, 503, or 504.
request-retry: 3

# Maximum number of different credentials to try for one failed request.
# Set to 0 to keep legacy behavior (try all available credentials).
max-retry-credentials: 0

# Maximum wait time in seconds for a cooled-down credential before triggering a retry.
max-retry-interval: 30

# When true, disable auth/model cooldown scheduling globally (prevents blackout windows after failure states).
disable-cooling: false

# When true, persist per-auth cooldown status as .cds files next to auth files.
# Default is false; when false, cooldown status is kept in memory only.
save-cooldown-status: false

# Cooldown duration in seconds for transient upstream errors (408/500/502/503/504).
# Set to 0 to keep the legacy 60-second cooldown; set to -1 to disable transient error cooldowns.
transient-error-cooldown-seconds: 0

# Persist public video task routing in data/video.db so create/poll/download
# keeps using the same upstream credential after process restarts. The in-memory
# cache remains as a compatibility fast path; this value only controls its TTL.
# video-result-auth-cache-ttl: "3h"

# Optional S3-compatible storage for completed video results. This works with
# AWS S3, Cloudflare R2, MinIO, and compatible services. Credentials are read
# from environment variables and are never embedded in this YAML.
# video-storage:
#   enabled: true
#   endpoint: "https://<account-id>.r2.cloudflarestorage.com"
#   region: "auto"                    # use the provider's signing region
#   bucket: "generated-videos"
#   path-style: true                  # recommended for R2/MinIO/custom endpoints
#   prefix: "videos"
#   signed-url-ttl: "15m"
#   max-source-bytes: 2147483648    # maximum upstream video spool size (2 GiB default)
#   access-key-id-env: "VIDEO_STORAGE_ACCESS_KEY_ID"
#   secret-access-key-env: "VIDEO_STORAGE_SECRET_ACCESS_KEY"
#   session-token-env: "VIDEO_STORAGE_SESSION_TOKEN" # optional

# MCP endpoints are exposed through the authenticated /mcp gateway. The top-level
# /mcp endpoint is a directory for available child routes, while concrete tools
# live under routes such as /mcp/image, /mcp/video, /mcp/zai/<server>, and /mcp/custom/<name>.
# Example DevSpace endpoint: clients call /mcp/custom/devspace while CliRelay
# forwards to the local DevSpace MCP server. This is a tool gateway, not an LLM
# model upstream.
# mcp-proxy:
#   servers:
#     - name: "devspace"
#       disabled: false
#       base-url: "http://127.0.0.1:7676/mcp"
#       headers:
#         X-Custom-Header: "custom-value"

# When true, globally disable Claude request cloaking (the Claude Code CLI disguise and
# system prompt replacement), so the original system prompt is passed through to Claude as-is.
# Individual credentials can still override this: a claude-api-key entry via its "cloak.mode",
# or a Claude OAuth/token file via a "cloak_mode" value. Default false keeps the per-client
# "auto" behavior (cloak only non-Claude-Code clients).
disable-claude-cloak-mode: false

# disable-image-generation supports: false (default), true, "chat", or "passthrough".
# - true: disable image_generation everywhere (also returns 404 for /v1/images/generations and /v1/images/edits).
# - "chat": disable image_generation injection on non-images endpoints, but keep /v1/images/generations and /v1/images/edits enabled.
# - "passthrough": never inject or strip image_generation on non-images endpoints (forward the client payload unchanged); behaves like "chat" on /v1/images/* endpoints.
disable-image-generation: false

# Base model used by the legacy hosted image_generation tool path when a Codex image request is not proxied directly through the Image API.
# Must start with "gpt-" (case-insensitive). If unset or invalid, defaults to "gpt-5.4-mini".
# gpt-image-2-base-model: "gpt-5.4-mini"

# Convert image/file/video inputs into text before sending them to matched text-model routes.
# Leave requested-models/upstream-models empty in a rule to match all models for the selected
# provider/protocol. Image generation endpoints still use their native /v1/images paths.
# multimodal-adapters:
#   enabled: true
#   default-action: extract
#   unavailable-action: reject
#   inject-as: visual_context
#   max-media-items: 4
#   max-output-bytes: 12000
#   rules:
#     - name: text-model-image-context
#       match:
#         upstream-providers:
#           - openai-compatibility
#           - bigmodel-coding
#         protocols:
#           - openai-response
#           - openai
#       extractor: vision-mcp
#       action: extract
#   extractors:
#     - name: vision-mcp
#       type: mcp
#       command: npx
#       args:
#         - -y
#         - "@your-org/vision-mcp-server"
#       tool-name: describe_image
#       prompt: Describe the image accurately and concisely for a downstream text model.
#       timeout-seconds: 60

# Core auth auto-refresh worker pool size (OAuth/file-based auth token refresh).
# When > 0, overrides the default worker count (16).
# auth-auto-refresh-workers: 16

# Quota exceeded behavior
quota-exceeded:
  switch-project: true # Whether to automatically switch to another project when a quota is exceeded
  switch-preview-model: true # Whether to automatically switch to a preview model when a quota is exceeded
  antigravity-credits: true # Whether to use credits as last-resort fallback when all free-tier auths are exhausted for Claude models

# Routing strategy for selecting credentials when multiple match.
routing:
  strategy: "round-robin" # round-robin (default), fill-first
  # Enable universal session-sticky routing for all clients.
  # Session IDs are extracted from: metadata.user_id (Claude Code session format),
  # X-Session-ID, Session_id (Codex), X-Client-Request-Id (PI), conversation_id,
  # or first few messages hash.
  # Automatic failover is always enabled when bound auth becomes unavailable.
  session-affinity: false # default: false
  # How long session-to-auth bindings are retained. Default: 1h
  session-affinity-ttl: "1h"
  # Conditional model routing. Rewrites the requested model before provider/auth selection.
  # model-routes:
  #   - name: codex-spark-under-128k
  #     match:
  #       requested-models:
  #         - gpt-5.3-codex
  #     measure:
  #       source: estimated-input-tokens # estimated-input-tokens (default), request-bytes
  #       on-missing: passthrough        # passthrough (default), reject
  #     routes:
  #       - max-input-tokens: 131072
  #         target:
  #           provider: codex
  #           model: gpt-5.3-codex-spark
  #           preserve-requested-model: true
  #       - min-input-tokens: 131073
  #         action: passthrough

# Context-window policies are evaluated after a concrete upstream route is known.
# Compression uses the selected model's context-length/max-completion-tokens metadata,
# keeps recent/system/open-tool items byte-for-byte, and asks the compressor for a structured
# memory capsule. Oversized first-use history is reduced in bounded batches. Prefix capsules
# and visual summaries are cached in memory by SHA-256 so a relay does not recompress the same
# full history or re-read the same image on every client turn. Raw conversation text and media
# bytes are not cached.
# Put more specific multimodal rules before general text rules; the first matching
# compression policy wins.
# request-policies:
#   - name: astron-glm-5.2-context-compression
#     match:
#       requested-models: [glm-5.2]
#       upstream-providers: [astron-code]
#       upstream-models: [xopglm52]
#     over-limit:
#       action: compress
#       compression:
#         provider: gemini
#         model: gemini-3.6-flash-tiered
#         auto-context: true
#         trigger-ratio: 0.82
#         target-ratio: 0.60
#         safety-margin-percent: 10
#         preserve-recent-items: 8
#         media-mode: auto
#         cache-ttl-seconds: 3600
#         cache-max-entries: 4096
#         unavailable-action: reject
#   - name: multimodal-history-for-small-target
#     match:
#       requested-models: [gpt-5.3-codex]
#       upstream-providers: [bigmodel-coding]
#       upstream-models: [glm-5.1]
#       request-features: [multimodal]
#     over-limit:
#       action: compress
#       compression:
#         provider: gemini
#         model: gemini-3.6-flash-tiered
#         auto-context: true
#         trigger-ratio: 0.82
#         target-ratio: 0.60
#         safety-margin-percent: 10
#         preserve-recent-items: 8
#         media-mode: auto       # old images may be summarized only when model metadata declares image input
#         cache-ttl-seconds: 3600
#         cache-max-entries: 4096
#         unavailable-action: reject
#   - name: text-history-for-small-target
#     match:
#       requested-models: [gpt-5.3-codex]
#       upstream-providers: [bigmodel-coding]
#       upstream-models: [glm-5.1]
#     limits:
#       max-input-tokens: 110000 # optional explicit override/guard in addition to model metadata
#     over-limit:
#       action: compress
#       compression:
#         provider: astron-code
#         model: deepseek-v4-flash
#         auto-context: true
#         trigger-ratio: 0.82
#         target-ratio: 0.60
#         target-input-tokens: 80000 # optional explicit target
#         preserve-recent-items: 8
#         media-mode: preserve   # text-only compressor never receives raw media
#         unavailable-action: reject

# Codex provider behavior.
codex:
  # When true, and routing.strategy is fill-first or routing.session-affinity is true,
  # remap Codex prompt_cache_key and installation identity per selected auth.
  # Some superstitious users believe request tracking identifiers can be used
  # as evidence for TOS enforcement bans; this option only satisfies those odd concerns.
  identity-confuse: false
  # Maximum wait for upstream HTTP response headers before rotating credentials.
  # Default: 90 seconds. Set a negative value to disable this guard.
  response-header-timeout-seconds: 90

# When true, enable authentication for the WebSocket API (/v1/ws).
ws-auth: true

# When > 0, emit blank lines every N seconds for non-streaming responses to prevent idle timeouts.
nonstream-keepalive-interval: 0
# Streaming behavior (SSE keep-alives + safe bootstrap retries).
# streaming:
#   keepalive-seconds: 15   # Default: 0 (disabled). <= 0 disables keep-alives.
#   bootstrap-retries: 1    # Default: 0 (disabled). Retries before first byte is sent.
#   responses-websocket-replay-retries: 8 # Default: 8. Safe replays for /v1/responses websocket EOF before output; 0 disables.

# Signature cache validation for thinking blocks (Antigravity/Claude).
# When true (default), cached signatures are preferred and validated.
# When false, client signatures are used directly after normalization (bypass mode for testing).
# antigravity-signature-cache-enabled: true

# Bypass mode signature validation strictness (only applies when signature cache is disabled).
# When true, validates full Claude protobuf tree (Field 2 -> Field 1 structure).
# When false (default), only checks R/E prefix + base64 + first byte 0x12.
# antigravity-signature-bypass-strict: false

# Gemini API keys
# gemini-api-key:
#   - api-key: "AIzaSy...01"
#     prefix: "test" # optional: require calls like "test/gemini-3-pro-preview" to target this credential
#     disable-cooling: false # optional: per-auth override for auth/model cooldown scheduling
#     base-url: "https://generativelanguage.googleapis.com"
#     headers:
#       X-Custom-Header: "custom-value"
#     proxy-url: "socks5://proxy.example.com:1080"
#     # proxy-url: "direct" # optional: explicit direct connect for this credential
#     models:
#       - name: "gemini-2.5-flash" # upstream model name
#         alias: "gemini-flash"    # client alias mapped to the upstream model
#         display-name: "Gemini Flash" # optional catalog display name
#     excluded-models:
#       - "gemini-2.5-pro"     # exclude specific models from this provider (exact match)
#       - "gemini-2.5-*"       # wildcard matching prefix (e.g. gemini-2.5-flash, gemini-2.5-pro)
#       - "*-preview"          # wildcard matching suffix (e.g. gemini-3-pro-preview)
#       - "*flash*"            # wildcard matching substring (e.g. gemini-2.5-flash-lite)
#   - api-key: "AIzaSy...02"

# Native Interactions API keys
# These keys are used only for direct /v1beta/interactions execution. Regular gemini-api-key entries still
# send Gemini generateContent/streamGenerateContent requests when the client enters through the interactions API.
# interactions-api-key:
#   - api-key: "AIzaSy...03"
#     prefix: "native" # optional: require calls like "native/gemini-3-pro-preview" to target this credential
#     disable-cooling: false # optional: per-auth override for auth/model cooldown scheduling
#     base-url: "https://generativelanguage.googleapis.com"
#     headers:
#       X-Custom-Header: "custom-value"
#     proxy-url: "socks5://proxy.example.com:1080"
#     # proxy-url: "direct" # optional: explicit direct connect for this credential
#     models:
#       - name: "gemini-2.5-flash" # upstream model name
#         alias: "native-gemini-flash" # client alias mapped to the upstream model
#     excluded-models:
#       - "gemini-2.5-pro"

# Codex API keys
# codex-api-key:
#   - api-key: "sk-atSM..."
#     prefix: "test" # optional: require calls like "test/gpt-5-codex" to target this credential
#     disable-cooling: false # optional: per-auth override for auth/model cooldown scheduling
#     base-url: "https://www.example.com" # use the custom codex API endpoint
#     headers:
#       X-Custom-Header: "custom-value"
#     proxy-url: "socks5://proxy.example.com:1080" # optional: per-key proxy override
#     # proxy-url: "direct" # optional: explicit direct connect for this credential
#     models:
#       - name: "gpt-5-codex"   # upstream model name
#         alias: "codex-latest" # client alias mapped to the upstream model
#         display-name: "Codex Latest" # optional catalog display name
#         force-mapping: true    # optional: rewrite response model fields back to the alias
#     excluded-models:
#       - "gpt-5.1"         # exclude specific models (exact match)
#       - "gpt-5-*"         # wildcard matching prefix (e.g. gpt-5-medium, gpt-5-codex)
#       - "*-mini"          # wildcard matching suffix (e.g. gpt-5-codex-mini)
#       - "*codex*"         # wildcard matching substring (e.g. gpt-5-codex-low)

# xAI API keys
# Uses the native xAI executor, including its Responses namespace-tool handling.
# xai-api-key:
#   - api-key: "xai-..."
#     prefix: "xai" # optional: require calls like "xai/grok-4.5" to target this credential
#     disable-cooling: false # optional: per-auth override for auth/model cooldown scheduling
#     base-url: "https://api.x.ai/v1" # xAI-compatible Responses API endpoint
#     websockets: true # optional: use the xAI upstream websocket transport for downstream websocket requests
#     headers:
#       X-Custom-Header: "custom-value"
#     proxy-url: "socks5://proxy.example.com:1080" # optional: per-key proxy override
#     # proxy-url: "direct" # optional: explicit direct connect for this credential
#     models:
#       - name: "grok-4.5"       # upstream model name
#         alias: "grok-latest"   # client alias mapped to the upstream model
#         display-name: "Grok Latest" # optional catalog display name
#         force-mapping: true     # optional: rewrite response model fields back to the alias
#     excluded-models:
#       - "grok-4.1"             # exclude specific models (exact match)
#       - "grok-3-*"             # wildcard matching prefix

# Claude API keys
# claude-api-key:
#   - api-key: "sk-atSM..." # use the official claude API key, no need to set the base url
#   - api-key: "sk-atSM..."
#     prefix: "test" # optional: require calls like "test/claude-sonnet-latest" to target this credential
#     disable-cooling: false # optional: per-auth override for auth/model cooldown scheduling
#     base-url: "https://www.example.com" # use the custom claude API endpoint
#     headers:
#       X-Custom-Header: "custom-value"
#     proxy-url: "socks5://proxy.example.com:1080" # optional: per-key proxy override
#     # proxy-url: "direct" # optional: explicit direct connect for this credential
#     models:
#       - name: "claude-3-5-sonnet-20241022" # upstream model name
#         alias: "claude-sonnet-latest"      # client alias mapped to the upstream model
#         display-name: "Claude Sonnet"      # optional catalog display name
#         force-mapping: true                 # optional: rewrite response model fields back to the alias
#     excluded-models:
#       - "claude-opus-4-5-20251101" # exclude specific models (exact match)
#       - "claude-3-*"               # wildcard matching prefix (e.g. claude-3-7-sonnet-20250219)
#       - "*-thinking"               # wildcard matching suffix (e.g. claude-opus-4-5-thinking)
#       - "*haiku*"                  # wildcard matching substring (e.g. claude-3-5-haiku-20241022)
#     rebuild-mid-system-message: false # optional: default is false; when true, move messages with role "system" into the top-level Claude system field
#     cloak:                         # optional: request cloaking for non-Claude-Code clients
#       mode: "auto"                 # "auto" (default): cloak only when client is not Claude Code
#                                    # "always": always apply cloaking
#                                    # "never": never apply cloaking
#       # This "cloak" block applies to this claude-api-key entry only. For Claude OAuth
#       # credentials, set the same options in the auth/token JSON file via "cloak_mode" /
#       # "cloak_strict_mode" / "cloak_sensitive_words" / "cloak_cache_user_id". The top-level
#       # "disable-claude-cloak-mode: true" disables cloaking for all Claude credentials at once.
#       strict-mode: false           # false (default): prepend Claude Code prompt to user system messages
#                                    # true: strip all user system messages, keep only Claude Code prompt
#       sensitive-words:             # optional: words to obfuscate with zero-width characters
#         - "API"
#         - "proxy"
#       cache-user-id: true          # optional: default is false; set true to reuse cached user_id per API key instead of generating a random one each request
#     experimental-cch-signing: false # optional: default is false; when true, sign the final /v1/messages body using the current Claude Code cch algorithm
#                                     # keep this disabled unless you explicitly need the behavior, so upstream seed changes fall back to legacy proxy behavior

# Default headers for Claude API requests. Update when Claude Code releases new versions.
# In legacy mode, user-agent/package-version/runtime-version/timeout are used as fallbacks
# when the client omits them, while OS/arch remain runtime-derived. When
# stabilize-device-profile is enabled, OS/arch stay pinned to the baseline values below,
# while user-agent/package-version/runtime-version seed a software fingerprint that can
# still upgrade to newer official Claude client versions.
# claude-header-defaults:
#   user-agent: "claude-cli/2.1.44 (external, sdk-cli)"
#   package-version: "0.74.0"
#   runtime-version: "v24.3.0"
#   os: "MacOS"
#   arch: "arm64"
#   timeout: "600"
#   stabilize-device-profile: false  # optional, default false; set true to enable per-auth/API-key fingerprint pinning

# Default headers for Codex OAuth model requests.
# These are used only for file-backed/OAuth Codex requests when the client
# does not send the header. `user-agent` applies to HTTP and websocket requests;
# `beta-features` only applies to websocket requests. They do not apply to codex-api-key entries.
# codex-header-defaults:
#   user-agent: "codex_cli_rs/0.114.0 (Mac OS 14.2.0; x86_64) vscode/1.111.0"
#   beta-features: "multi_agent"

# Kimi OAuth and model-request identity headers. Defaults avoid exposing the
# relay product name, build version, host name, and host platform.
# kimi-header-defaults:
#   user-agent: "codex"
#   platform: "codex"
#   version: "1.0.0"
#   device-name: "codex"
#   device-model: "codex"
#
# The stable credential-specific X-Msh-Device-Id is preserved separately.

