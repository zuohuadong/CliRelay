name: translator-path-guard

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  ensure-no-translator-changes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Allow dev to main release PR
        if: github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'dev'
        run: echo "Skipping translator path guard for dev -> main release PR."
      - name: Detect internal/translator changes
        if: !(github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'dev')
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            internal/translator/**
      - name: Fail when restricted paths change
        if: steps.changed-files.outputs.any_changed == 'true' && !(github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'dev')
        run: |
          echo "Changes under internal/translator are not allowed in pull requests."
          echo "You need to create an issue for our maintenance team to make the necessary changes."
          exit 1
