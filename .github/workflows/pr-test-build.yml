name: pr-test-build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reject vendored panel assets
        run: ./scripts/ensure-no-vendored-panel-assets.sh
      - name: Refresh models catalog
        run: |
          git fetch --depth 1 https://github.com/router-for-me/models.git main
          git show FETCH_HEAD:models.json > internal/registry/models/models.json
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Gofmt check
        run: |
          set -euo pipefail
          files="$(gofmt -l . || true)"
          if [ -n "${files}" ]; then
            echo "gofmt needed for:"
            echo "${files}"
            exit 1
          fi
      - name: Secret smoke scan
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import sys

          key_re = re.compile(r"\bsk-[A-Za-z0-9]{16,}\b")
          skip_dirs = {".git", ".gocache", ".tmp-go", ".agentflow"}
          skip_ext = {".png", ".jpg", ".jpeg", ".gif", ".ico", ".svg", ".pdf", ".zip"}

          bad = []
          for root, dirs, files in os.walk("."):
            dirs[:] = [d for d in dirs if d not in skip_dirs]
            for fn in files:
              _, ext = os.path.splitext(fn)
              if ext.lower() in skip_ext:
                continue
              path = os.path.join(root, fn)
              try:
                with open(path, "rb") as f:
                  data = f.read()
              except OSError:
                continue

              if b"\x00" in data:
                continue
              text = data.decode("utf-8", errors="ignore")
              for match in key_re.finditer(text):
                key = match.group(0)
                if ("X" in key) or ("*" in key):
                  continue
                bad.append((path, key))

          if bad:
            print("Found real-looking API key(s). Use placeholders like 'sk-...XXXX...' or masked forms.")
            for path, key in bad[:50]:
              print(f"  {path}: {key}")
            sys.exit(1)
          PY
      - name: Sync safety guard
        run: ./scripts/sync-safety-check.sh
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: |
          go build -o test-output ./cmd/server
          rm -f test-output
      - name: Check panel source exists
        run: |
          test -f panel/package.json || { echo "panel/package.json not found"; exit 1; }
          test -f panel/vite.config.ts || { echo "panel/vite.config.ts not found"; exit 1; }
