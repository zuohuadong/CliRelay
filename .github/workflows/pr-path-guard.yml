name: translator-path-guard

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  ensure-no-translator-changes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect internal/translator changes
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            internal/translator/**
      - name: Check if only import paths changed (v7 migration)
        id: check-migration
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          # Allow v7 migration PRs that only update import paths
          # Check if the diff only contains import path changes (v6 -> v7)
          ALLOWED=true
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            if [[ "$file" == internal/translator/* ]]; then
              # Get the diff and check if it's only import path changes
              DIFF=$(git diff origin/dev...HEAD -- "$file" 2>/dev/null || git diff HEAD~1 -- "$file")
              # Count non-import changes (lines that don't look like import path updates)
              NON_IMPORT_CHANGES=$(echo "$DIFF" | grep -E '^\+[^+]' | grep -v 'CLIProxyAPI/v[67]' | grep -v '^[+-]\s*$' | wc -l)
              if [ "$NON_IMPORT_CHANGES" -gt 0 ]; then
                echo "Non-import changes detected in $file: $NON_IMPORT_CHANGES lines"
                ALLOWED=false
              fi
            fi
          done
          if [ "$ALLOWED" = true ]; then
            echo "import_changes_only=true" >> $GITHUB_OUTPUT
          else
            echo "import_changes_only=false" >> $GITHUB_OUTPUT
          fi
      - name: Fail when restricted paths change
        if: steps.changed-files.outputs.any_changed == 'true' && steps.check-migration.outputs.import_changes_only != 'true'
        run: |
          echo "Changes under internal/translator are not allowed in pull requests."
          echo "You need to create an issue for our maintenance team to make the necessary changes."
          exit 1
