services:
  cli-proxy-api:
    image: ${CLI_PROXY_IMAGE:-ghcr.io/zuohuadong/clirelay:latest}
    pull_policy: always
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: cli-proxy-api
    # env_file:
    #   - .env
    environment:
      DEPLOY: ${DEPLOY:-}
      VIDEO_STORAGE_ACCESS_KEY_ID: ${VIDEO_STORAGE_ACCESS_KEY_ID:-}
      VIDEO_STORAGE_SECRET_ACCESS_KEY: ${VIDEO_STORAGE_SECRET_ACCESS_KEY:-}
      VIDEO_STORAGE_SESSION_TOKEN: ${VIDEO_STORAGE_SESSION_TOKEN:-}
    ports:
      - "8317:8317"
      - "8085:8085"
      - "1455:1455"
      - "54545:54545"
      - "51121:51121"
      - "11451:11451"
    volumes:
      - ${CLI_PROXY_CONFIG_PATH:-./config.yaml}:/CLIProxyAPI/config.yaml
      - ${CLI_PROXY_AUTH_PATH:-./auths}:/root/.cli-proxy-api
      - ${CLI_PROXY_LOG_PATH:-./logs}:/CLIProxyAPI/logs
      - ${CLI_PROXY_DATA_PATH:-./data}:/CLIProxyAPI/data
    restart: unless-stopped
