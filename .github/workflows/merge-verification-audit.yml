name: merge-verification-audit

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  repair:
    if: >-
      github.repository == 'zuohuadong/CliRelay' &&
      github.event.pull_request.number == 193 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/panel-verification-20261002'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/panel-verification-20261002
          fetch-depth: 1
      - name: Confirm expected head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Reproduce original timing failures
        run: |
          set -uo pipefail
          mkdir -p /tmp/websocket-verification
          go test ./internal/runtime/executor -run 'TestCodexWebsockets.*(OverloadDirectlyAfterTimeoutDeliveredInStream|KeepalivePingDuringUpload)' -count=30 -json -timeout=3m > /tmp/websocket-verification/before.jsonl 2>&1
          status=$?
          echo "Original targeted test exit: $status"
          python3 - <<'PY'
          import json
          from pathlib import Path
          failed = set()
          for line in Path('/tmp/websocket-verification/before.jsonl').read_text().splitlines():
              try:
                  event = json.loads(line)
              except ValueError:
                  continue
              if event.get('Action') == 'fail' and event.get('Test'):
                  failed.add(event['Test'])
          print('Original failing tests:', sorted(failed))
          PY
      - name: Patch only verified test fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path.cwd()
          expected = {
              'internal/runtime/executor/codex_stream_bootstrap_buffering_test.go': '2c92349eb89b7329986d239a912567d981c367e7',
              'internal/runtime/executor/codex_websockets_executor_test.go': '8c35dc316e1363374820e96d2578fc44aaf5b40d',
          }
          for name, sha in expected.items():
              data = (root / name).read_bytes()
              actual = hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
              if actual != sha:
                  raise SystemExit(f'Refusing to patch changed source: {name}')
          def once(text, old, new):
              if text.count(old) != 1:
                  raise SystemExit(f'Expected one match: {old[:100]!r}')
              return text.replace(old, new, 1)
          path = root / 'internal/runtime/executor/codex_stream_bootstrap_buffering_test.go'
          text = path.read_text()
          text = once(text, 'type mockClock struct {\n\tmu  sync.Mutex\n\tcur time.Time\n}', 'type mockClock struct {\n\tmu      sync.Mutex\n\tcur     time.Time\n\tstarted chan struct{}\n\tonce    sync.Once\n}')
          text = once(text, 'func (m *mockClock) now() time.Time {\n\tm.mu.Lock()\n\tdefer m.mu.Unlock()\n\treturn m.cur\n}', 'func (m *mockClock) now() time.Time {\n\tm.mu.Lock()\n\tnow := m.cur\n\tm.mu.Unlock()\n\t// 先捕获计时起点，再通知服务端；否则推进时钟仍可能抢在首次读取之前。\n\tm.once.Do(func() { close(m.started) })\n\treturn now\n}\n\nfunc (m *mockClock) waitForStart(t *testing.T) bool {\n\tt.Helper()\n\tselect {\n\tcase <-m.started:\n\t\treturn true\n\tcase <-time.After(2 * time.Second):\n\t\tt.Error("timed out waiting for bootstrap clock initialization")\n\t\treturn false\n\t}\n}')
          text = once(text, 'm := &mockClock{cur: initial}', 'm := &mockClock{cur: initial, started: make(chan struct{})}')
          old = '\tbootstrapStarted := make(chan struct{})\n\tvar once sync.Once\n\tcleanup := setCodexBootstrapNowForTest(func() time.Time {\n\t\tonce.Do(func() {\n\t\t\tclose(bootstrapStarted)\n\t\t})\n\t\treturn clock.now()\n\t})\n\tt.Cleanup(cleanup)\n\n'
          if text.count(old) != 2:
              raise SystemExit('Unexpected existing HTTP clock synchronization')
          text = text.replace(old, '').replace('\t\t<-bootstrapStarted\n', '')
          if text.count('\t\tclock.advance(') != 8:
              raise SystemExit('Unexpected clock advance count')
          text = text.replace('\t\tclock.advance(', '\t\tif !clock.waitForStart(t) {\n\t\t\treturn\n\t\t}\n\t\tclock.advance(')
          path.write_text(text)
          path = root / 'internal/runtime/executor/codex_websockets_executor_test.go'
          text = path.read_text()
          for name in ['WithSession', 'Sessionless', 'NonstreamSessionless']:
              start = text.index('func TestCodexWebsockets_KeepalivePingDuringUpload_' + name + '(')
              end = text.find('\nfunc ', start + 1)
              if end < 0:
                  end = len(text)
              body = text[start:end]
              begin = body.index('\n\t\tgo func() {')
              finish = body.index('\n\t\t}()', begin) + len('\n\t\t}()')
              body = body[:begin] + '\n\t\trequestRead := make(chan error, 1)\n\t\tgo func() {\n\t\t\t_, _, errRead := conn.ReadMessage()\n\t\t\trequestRead <- errRead\n\t\t}()' + body[finish:]
              body = body.replace('\t\treadErrCh := make(chan error, 1)\n', '')
              marker = '\t\trespPayload := []byte(`{"type":"response.completed"'
              body = once(body, marker, '\t\t// Pong 只证明保活成功；先接收完整请求再结束连接，避免中断仍在上传的数据。\n\t\tselect {\n\t\tcase errRead := <-requestRead:\n\t\t\tif errRead != nil {\n\t\t\t\tt.Errorf("read uploaded request: %v", errRead)\n\t\t\t\treturn\n\t\t\t}\n\t\tcase <-time.After(2 * time.Second):\n\t\t\tt.Error("timed out waiting for uploaded request after pong")\n\t\t\treturn\n\t\t}\n\n' + marker)
              line = next(line for line in body.splitlines() if line.startswith('\t\t_ = conn.WriteControl(websocket.PingMessage, '))
              expr = line[len('\t\t_ = '):]
              body = once(body, line, '\t\tif errPing := ' + expr + '; errPing != nil {\n\t\t\tt.Errorf("send keepalive ping: %v", errPing)\n\t\t\treturn\n\t\t}')
              text = text[:start] + body + text[end:]
          path.write_text(text)
          PY
          gofmt -w internal/runtime/executor/codex_stream_bootstrap_buffering_test.go internal/runtime/executor/codex_websockets_executor_test.go
          git diff --check
          git diff > /tmp/websocket-verification/fix.patch
          git diff --stat
      - name: Repeat timeout and upload contracts 100 times
        run: |
          set -euo pipefail
          go test ./internal/runtime/executor -run 'TestCodex(Executor|WebsocketsExecutor)_BootstrapBuffering_(TimeBudgetReleasesStream|DisabledTimeBudget|DefaultUnsetTimeoutIsUnlimited|OverloadDirectlyAfterTimeoutDeliveredInStream|StatusBearingErrorAfterTimeoutDeliveredInStream)|TestCodexWebsockets_KeepalivePingDuringUpload_' -count=100 -timeout=5m -json > /tmp/websocket-verification/repeated.jsonl 2>&1
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          counts = Counter()
          for line in Path('/tmp/websocket-verification/repeated.jsonl').read_text().splitlines():
              event = json.loads(line)
              if event.get('Action') == 'pass' and event.get('Test'):
                  counts[event['Test']] += 1
          print(json.dumps(counts, indent=2))
          assert len(counts) == 11 and all(value == 100 for value in counts.values()), counts
          PY
      - name: Race-check the same contracts 20 times
        run: |
          set -euo pipefail
          go test -race ./internal/runtime/executor -run 'TestCodex(Executor|WebsocketsExecutor)_BootstrapBuffering_(TimeBudgetReleasesStream|DisabledTimeBudget|DefaultUnsetTimeoutIsUnlimited|OverloadDirectlyAfterTimeoutDeliveredInStream|StatusBearingErrorAfterTimeoutDeliveredInStream)|TestCodexWebsockets_KeepalivePingDuringUpload_' -count=20 -timeout=5m -json > /tmp/websocket-verification/race.jsonl 2>&1
      - name: Commit verified test changes to the repair branch
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          import subprocess
          expected = {'internal/runtime/executor/codex_stream_bootstrap_buffering_test.go', 'internal/runtime/executor/codex_websockets_executor_test.go'}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only']).decode().splitlines())
          assert changed == expected, changed
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- internal/runtime/executor/codex_stream_bootstrap_buffering_test.go internal/runtime/executor/codex_websockets_executor_test.go
          git commit -m 'test(codex): synchronize bootstrap clocks and keepalive upload completion' -m 'Wait for the captured bootstrap clock origin before advancing time. Keep the fixture connection open until the request upload finishes after Pong. Preserve runtime behavior and all timeout/keepalive assertions.'
          git push origin HEAD:refs/heads/fix/panel-verification-20261002
      - name: Save diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: websocket-merge-verification
          path: /tmp/websocket-verification/
          retention-days: 3
