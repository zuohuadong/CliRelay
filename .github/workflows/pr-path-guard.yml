name: translator-path-guard

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  ensure-no-translator-changes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check PR title for v7 migration
        id: check-title
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          if [[ "$PR_TITLE" == *"v7"* ]] || [[ "$PR_TITLE" == *"migrate"* ]]; then
            echo "v7_migration=true" >> $GITHUB_OUTPUT
          else
            echo "v7_migration=false" >> $GITHUB_OUTPUT
          fi
      - name: Detect internal/translator changes
        if: steps.check-title.outputs.v7_migration != 'true'
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            internal/translator/**
      - name: Fail when restricted paths change
        if: steps.check-title.outputs.v7_migration != 'true' && steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "Changes under internal/translator are not allowed in pull requests."
          echo "You need to create an issue for our maintenance team to make the necessary changes."
          exit 1
