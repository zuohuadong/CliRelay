name: panel-sync-audit

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  inventory:
    if: >-
      github.repository == 'zuohuadong/CliRelay' &&
      github.event.pull_request.number == 192 &&
      github.event.pull_request.head.ref == 'fix/review-maintenance-workflows-20261002'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned upstream for read-only comparison
        uses: actions/checkout@v4
        with:
          repository: kittors/codeProxy
          ref: 5e0b8d84501bc48b60d95167b3238d5f284e8c62
          path: .audit-upstream
          persist-credentials: false
      - name: Compare tracked sources and collect audit inputs
        run: |
          python3 - <<'PY'
          import collections, hashlib, json, pathlib, re, subprocess, tarfile
          root = pathlib.Path.cwd()
          upstream = root / '.audit-upstream'
          out = root / '.audit'
          out.mkdir()
          def tracked(cwd):
              return subprocess.check_output(['git', 'ls-files', '-z'], cwd=cwd).decode().split('\0')[:-1]
          local_files = [p[6:] for p in tracked(root) if p.startswith('panel/')]
          upstream_files = tracked(upstream)
          def pages(cwd, files):
              return sorted(p for p in files if re.search(r'(?:Page|page)\.tsx$', p) and not re.search(r'\.(?:test|spec)\.', p))
          local_pages = pages(root / 'panel', local_files)
          upstream_pages = pages(upstream, upstream_files)
          shared = sorted(set(local_files) & set(upstream_files))
          same = [p for p in shared if (root / 'panel' / p).read_bytes() == (upstream / p).read_bytes()]
          report = {
              'local_head': subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),
              'upstream_head': subprocess.check_output(['git','rev-parse','HEAD'],cwd=upstream).decode().strip(),
              'local_tracked_count': len(local_files), 'upstream_tracked_count': len(upstream_files),
              'shared_paths': len(shared), 'identical_shared_paths': len(same),
              'local_pages': local_pages, 'upstream_pages': upstream_pages,
              'local_only_page_basenames': sorted(set(map(lambda p: pathlib.Path(p).name, local_pages)) - set(map(lambda p: pathlib.Path(p).name, upstream_pages))),
              'upstream_only_page_basenames': sorted(set(map(lambda p: pathlib.Path(p).name, upstream_pages)) - set(map(lambda p: pathlib.Path(p).name, local_pages))),
          }
          (out / 'inventory.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False,indent=2))
          with tarfile.open(out / 'audit-sources.tar.gz', 'w:gz') as archive:
              for prefix, cwd, paths in [('local',root,tracked(root)),('upstream',upstream,upstream_files)]:
                  for p in paths:
                      path = pathlib.Path(p)
                      wanted = (prefix == 'upstream' or p.startswith(('panel/','internal/api/','internal/config/','internal/managementasset/','.github/','scripts/')))
                      if wanted and path.suffix in {'.ts','.tsx','.js','.mjs','.json','.go','.yaml','.yml','.sh','.md'}:
                          archive.add(cwd / p, arcname=prefix + '/' + p, recursive=False)
          PY
      - name: Save source inventory and audit inputs
        uses: actions/upload-artifact@v4
        with:
          name: panel-sync-audit
          path: .audit/
          include-hidden-files: true
          retention-days: 3
