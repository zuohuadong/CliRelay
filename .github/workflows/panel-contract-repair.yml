name: panel-contract-repair

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  repair:
    if: >-
      github.repository == 'zuohuadong/CliRelay' &&
      github.event.pull_request.number == 193 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/panel-verification-20261002'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/panel-verification-20261002
      - name: Verify expected source
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          test "$(git hash-object internal/api/server_management.go)" = a59e1a114a2599cf9343b3842ce33ce97deb3893
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Reproduce actual missing route before repair
        run: |
          set -euo pipefail
          if go test ./internal/api -run '^TestPanelBillingMultiplierRoutes$' -count=1 > "${RUNNER_TEMP}/billing-before.log" 2>&1; then
            echo 'Expected the regression to fail before route registration'
            exit 1
          fi
          grep -F 'panel billing route GET: status=404 want=200' "${RUNNER_TEMP}/billing-before.log"
      - name: Register existing handlers behind management access control
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('internal/api/server_management.go')
          text = path.read_text()
          old = '\t\tmgmt.GET("/config", s.mgmt.GetConfig)\n'
          assert text.count(old) == 1
          new = old + '\t\tmgmt.GET("/billing-multipliers", s.mgmt.GetBillingMultipliers)\n\t\tmgmt.PUT("/billing-multipliers", s.mgmt.PutBillingMultipliers)\n'
          path.write_text(text.replace(old, new, 1))
          PY
          gofmt -w internal/api/server_management.go internal/api/server_panel_billing_test.go
          git diff --check
      - name: Verify panel contract and management access control
        run: go test ./internal/api -run 'Test(PanelBillingMultiplierRoutes|ManagementV8RoutesShareAccessControl)$' -count=1 -v
      - name: Commit tested route repair to the repair branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- internal/api/server_management.go internal/api/server_panel_billing_test.go
          git commit -m 'fix(api): restore billing multiplier routes used by runtime settings'
          git push origin HEAD:refs/heads/fix/panel-verification-20261002
